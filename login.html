<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURMALDA - Вход</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="casino-container login-container">
        <div class="title-section">
            <h1 class="casino-title">BURMALDA</h1>
            <div class="jackpot-lights">
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
                <div class="light"></div>
            </div>
        </div>

        <div id="login-form-container">
            <form class="login-form" id="login-form">
                <div id="email-container">
                    <input type="email" class="login-input" id="email" placeholder="Электронная почта" required>
                </div>
                <div id="password-container">
                    <input type="password" class="login-input" id="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="login-button">
                    ВОЙТИ <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>
            <div class="login-hint">
                Нет аккаунта? <a href="#" id="register-link">Зарегистрироваться</a>
                <br><a href="#" id="clear-storage-link" class="clear-storage">Очистить данные</a>
            </div>
            <div id="login-message" class="login-message"></div>
        </div>
        
        <div id="register-form-container" style="display: none;">
            <form class="login-form" id="register-form">
                <div>
                    <input type="text" class="login-input" id="reg-name" placeholder="Ваше имя" required>
                </div>
                <div>
                    <input type="email" class="login-input" id="reg-email" placeholder="Электронная почта" required>
                </div>
                <div>
                    <input type="password" class="login-input" id="reg-password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="login-button">
                    РЕГИСТРАЦИЯ <i class="fas fa-user-plus"></i>
                </button>
            </form>
            <div class="login-hint">
                Уже есть аккаунт? <a href="#" id="login-link">Войти</a>
            </div>
            <div id="register-message" class="login-message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Simple animation for the lights
            const lights = document.querySelectorAll('.light');
            setInterval(() => {
                lights.forEach((light, index) => {
                    setTimeout(() => {
                        light.classList.toggle('active');
                    }, index * 100);
                });
            }, 1000);
 
            const users = [
                {
                    "email": "newuser@example.com",
                    "password": "securepassword",
                    "name": "New User",
                    "balance": 0
                },
                {
                    "email": "anotheruser@example.com",
                    "password": "anotherpassword",
                    "name": "Another User",
                    "balance": 50
                },
                {
                    "email": "haakbonn@gmail.com",
                    "password": "pisyapopakakashechka",
                    "name": "Another User",
                    "balance": 20
                },
                {
                    "email": "holubholub2006@gmail.com",
                    "password": "aboba228666",
                    "name": "Another User",
                    "balance": 20
                },
                {
                    "email": "traninartem40@gmail.com",
                    "password": "17196800",
                    "name": "Another User",
                    "balance": 0
                }
            ];
            
            // Обработка формы логина
            const loginForm = document.getElementById('login-form');
            const loginMessage = document.getElementById('login-message');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Пытаемся найти пользователя
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    loginMessage.textContent = 'Вход выполнен успешно!';
                    loginMessage.style.color = 'var(--casino-gold)';
                    
                    // Сохраняем данные пользователя
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    // Переадресация на главную страницу после короткой задержки
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    loginMessage.textContent = 'Неверный email или пароль!';
                    loginMessage.style.color = 'var(--casino-red)';
                    
                    // Анимация ошибки
                    const inputs = document.querySelectorAll('.login-input');
                    inputs.forEach(input => {
                        input.classList.add('error');
                        setTimeout(() => {
                            input.classList.remove('error');
                        }, 500);
                    });
                }
            });
            
            // Переключение между формами входа и регистрации
            const registerLink = document.getElementById('register-link');
            const loginLink = document.getElementById('login-link');
            const loginContainer = document.getElementById('login-form-container');
            const registerContainer = document.getElementById('register-form-container');
            
            registerLink.addEventListener('click', function(e) {
                e.preventDefault();
                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
            });
            
            loginLink.addEventListener('click', function(e) {
                e.preventDefault();
                registerContainer.style.display = 'none';
                loginContainer.style.display = 'block';
            });
            
            // Обработчик для очистки localStorage
            const clearStorageLink = document.getElementById('clear-storage-link');
            clearStorageLink.addEventListener('click', function(e) {
                e.preventDefault();
                // Очистка localStorage
                localStorage.removeItem('currentUser');
                // Или для очистки всего localStorage:
                // localStorage.clear();
                
                loginMessage.textContent = 'Данные успешно очищены!';
                loginMessage.style.color = 'var(--casino-gold)';
                
                setTimeout(() => {
                    loginMessage.textContent = '';
                }, 3000);
            });
            
            // Обработка формы регистрации
            const registerForm = document.getElementById('register-form');
            const registerMessage = document.getElementById('register-message');
            
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('reg-name').value;
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                
                // Проверяем, не существует ли уже такой email
                if (users.some(u => u.email === email)) {
                    registerMessage.textContent = 'Пользователь с таким email уже существует!';
                    registerMessage.style.color = 'var(--casino-red)';
                    return;
                }
                
                // Создаем нового пользователя
                const newUser = {
                    email: email,
                    password: password,
                    name: name,
                    balance: 0 // Начальный баланс
                };
                
                // Добавляем в "базу данных"
                users.push(newUser);
                
                registerMessage.textContent = 'Регистрация успешна! Перенаправление...';
                registerMessage.style.color = 'var(--casino-gold)';
                
                // Автоматический вход после регистрации
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            });
            
            // Для тестирования страницы логина, автоматический редирект отключен
            // Чтобы включить автоматический переход на главную страницу для уже авторизованных пользователей, 
            // раскомментируйте код ниже:
            
            /*
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                // Пользователь уже вошел в систему, перенаправляем на главную страницу
                window.location.href = 'index.html';
            }
            */
        });
    </script>
    
    <style>
        /* Дополнительные стили для страницы логина */
        .error {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--casino-red) !important;
            box-shadow: 0 0 10px var(--casino-red);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .login-container {
            padding: 2rem;
            max-width: 450px;
            margin: 5vh auto;
        }
        
        .casino-title {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }
        
        .login-form {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .login-input {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 2px solid var(--casino-gold);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .login-input:focus {
            outline: none;
            border-color: #ffe066;
            box-shadow: 0 0 8px rgba(245, 204, 62, 0.6);
        }
        
        .login-button {
            margin-top: 0.5rem;
            padding: 0.8rem;
            border-radius: 8px;
            background: linear-gradient(to bottom, var(--casino-gold), #e6b800);
            color: var(--casino-dark);
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 #c99a00;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c99a00, var(--button-glow);
        }
        
        .login-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c99a00;
        }
        
        .login-hint {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--casino-light);
        }
        
        .login-hint a {
            color: var(--casino-gold);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        
        .login-hint a:hover {
            text-shadow: 0 0 5px var(--casino-gold);
        }
        
        .clear-storage {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #aaa !important;
        }
        
        .clear-storage:hover {
            color: var(--casino-red) !important;
        }
        
        .login-message {
            margin-top: 1rem;
            text-align: center;
            min-height: 1.5rem;
            font-weight: bold;
        }
        
        /* Анимация для сообщений */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-message {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</body>
</html>
